<body>
<div class="shell"><header class="top"><button class="smallbtn" id="homeBtn">집으로</button></header>
<main class="page"><section class="view active" id="landingView"><div class="landing-stage"><div class="landing-title">엄마 이것도<br/>다 실력이야!</div><div class="landing-prompt">open the door ↓</div><div class="house-drawing"><div class="house-roof"></div><div class="house-front"><div class="house-window one"></div><div class="house-window two"></div><button aria-label="집 안으로 들어가기" class="front-door" id="enterHouse"><span class="knob"></span></button></div></div></div></section><section class="view" id="floorView"><div aria-label="집 평면도" class="floorplan"><div class="floorplan-caption">어느 방으로 갈까?</div><div class="plan-canvas"><button aria-label="주방" class="plan-choice kitchen" data-room="kitchen"><span>주방</span><i class="sink-symbol"></i></button><button aria-label="거실" class="plan-choice living" data-room="living"><span>거실</span><i class="sofa-symbol"></i></button><button aria-label="내 방" class="plan-choice bedroom" data-room="bedroom"><span>내 방</span><i class="bed-symbol"></i></button><button aria-label="욕실" class="plan-choice bath" data-room="bath"><span>욕실</span><i class="bath-symbol"></i></button><div class="plan-corridor"></div></div></div></section>

<section class="view" id="kitchenView"><p class="lead">주방</p><div class="panel"><div class="kitchenScene"><div class="kitchenWall"></div><div class="kitchenShelves"></div><div aria-hidden="true" class="kitchenPlates">◯ ▱ ◯</div><div class="kitchenCounter"></div><div class="kitchenSink"></div><div class="kitchenTap"></div><button class="bubble kitchenBubble" data-game="kitchen">“밥 먹었으면<br/>설거지 좀 바로 해!”</button></div></div><div class="actions"><button class="btn secondary" id="kitchenBack">← 뒤로</button></div></section>

<script>
const $=s=>document.querySelector(s);
const views=[...document.querySelectorAll('.view')];
let currentGame=null,running=false,raf=0,lastTime=0,elapsed=0,gameDuration=30;
let stackCount=0,stackPieces=[],stackX=0,stackDir=1,stackSpeed=125,stackWidth=104,stackY=0,stackMoving=false,stackTransition=null;
const area=$('#gameArea'),result=$('#result');
function stop(){running=false;cancelAnimationFrame(raf);if(stackTransition)clearTimeout(stackTransition);stackTransition=null;lastTime=0;area.querySelector('.stackStage,.kitchenPuzzle,.realKitchen,.phoneStage,.mirrorStage')?.remove();$('#avatar').classList.remove('hidden');$('#leftBtn').classList.remove('hidden');$('#rightBtn').classList.remove('hidden');$('#leftBtn').textContent='← 왼쪽';$('#rightBtn').textContent='오른쪽 →'}
function show(id){stop();views.forEach(v=>v.classList.toggle('active',v.id===id));window.scrollTo({top:0,behavior:'smooth'})}
$('#homeBtn').onclick=()=>show('landingView');$('#enterHouse').onclick=()=>show('floorView');$('#backHome').onclick=()=>show('floorView');$('#kitchenBack').onclick=()=>show('floorView');document.querySelectorAll('[data-back-home]').forEach(b=>b.onclick=()=>show('floorView'));$('#roomBtn').onclick=()=>show(returnView());$('#exitGame').onclick=()=>show(returnView());
function returnView(){return currentGame==='kitchen'?'kitchenView':currentGame==='phone'?'livingView':'roomView'}
document.querySelectorAll('.plan-choice').forEach(b=>b.onclick=()=>show(({kitchen:'kitchenView',bedroom:'roomView',living:'livingView',bath:'bathView'})[b.dataset.room]||'floorView'));
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>start(b.dataset.game));$('#retryBtn').onclick=()=>start(currentGame);
function updateScore(){if(currentGame==='kitchen'){$('#scoreBoard').textContent=`쌓아둔 그릇 ${kitchenPlaced.size} / 8개`;}else if(currentGame==='phone'){$('#scoreBoard').textContent=`버틴 시간 ${Math.min(15,elapsed).toFixed(1)} / 15초`;}else{$('#scoreBoard').textContent=`쌓은 옷 ${stackCount} / 10벌`;}}

 $('#avatar').classList.add('hidden');$('#leftBtn').classList.add('hidden');$('#rightBtn').classList.add('hidden');

 // Small game label intentionally hidden
 if(type==='kitchen'){startKitchen()}else if(type==='phone'){startPhone()}else{startStack()}

}

/* Kitchen: top-down dishes, continuous placement rather than tetromino tiles. */
const kitchenDefs=[
 {name:'큰 접시',type:'plate',color:'#e7ac9c',rx:43,ry:43},
 {name:'파스타 접시',type:'plate',color:'#b2cddd',rx:39,ry:39},
 {name:'밥그릇',type:'bowl',color:'#c6b8d9',rx:31,ry:31},
 {name:'국그릇',type:'bowl',color:'#e6cb91',rx:34,ry:34},
 {name:'머그컵',type:'mug',color:'#a9c8b4',rx:29,ry:25},
 {name:'반찬 접시',type:'plate',color:'#ebbbca',rx:30,ry:30},
 {name:'타원 접시',type:'oval',color:'#b7d8d4',rx:47,ry:23},
 {name:'유리컵',type:'glass',color:'#c7d5e9',rx:22,ry:22}
];
const KX=132,KY=64,KW=256,KH=174;
let kitchenPlaced=new Map(),kitchenSelected=0,kitchenRotation=0,kitchenPointer=null;
function kitchenDims(id,rot){const d=kitchenDefs[id];return rot%2?[d.ry,d.rx]:[d.rx,d.ry]}
function kitchenHit(id,x,y,rot,px,py){let dx=px-x,dy=py-y;if(rot%2)[dx,dy]=[dy,-dx];const d=kitchenDefs[id];return (dx*dx/(d.rx*d.rx)+dy*dy/(d.ry*d.ry))<=1.01}
function kitchenValid(id,x,y,rot){const [rx,ry]=kitchenDims(id,rot);if(x-rx<KX+4||x+rx>KX+KW-4||y-ry<KY+4||y+ry>KY+KH-4)return false;
 for(const [other,pos] of kitchenPlaced){if(other===id)continue;const box=kitchenDims(other,pos.rot);if(Math.abs(pos.x-x)>rx+box[0]+6||Math.abs(pos.y-y)>ry+box[1]+6)continue;
  // Sample boundaries and interiors of the two dish footprints to check actual overlap.
  for(let yy=-ry;yy<=ry;yy+=5)for(let xx=-rx;xx<=rx;xx+=5)if(kitchenHit(id,x,y,rot,x+xx,y+yy)&&kitchenHit(other,pos.x,pos.y,pos.rot,x+xx,y+yy))return false;
  for(let yy=-box[1];yy<=box[1];yy+=5)for(let xx=-box[0];xx<=box[0];xx+=5)if(kitchenHit(other,pos.x,pos.y,pos.rot,pos.x+xx,pos.y+yy)&&kitchenHit(id,x,y,rot,pos.x+xx,pos.y+yy))return false;
 }
 return true;
}
function dishSVG(id,x,y,rot=0,extra=''){const d=kitchenDefs[id],a=rot*90;let content='';
 if(d.type==='plate'||d.type==='oval')content=`<ellipse rx="${d.rx}" ry="${d.ry}" fill="${d.color}" stroke="#53565a" stroke-width="2.5"/><ellipse rx="${d.rx*.77}" ry="${d.ry*.77}" fill="#fffaf4" stroke="#9b9b9b" stroke-width="2"/><ellipse rx="${d.rx*.57}" ry="${d.ry*.57}" fill="none" stroke="${d.color}" stroke-width="2"/>`;
 else if(d.type==='bowl')content=`<circle r="${d.rx}" fill="${d.color}" stroke="#53565a" stroke-width="2.5"/><circle r="${d.rx*.77}" fill="#fffaf1" stroke="#9a9995" stroke-width="2"/><circle r="${d.rx*.52}" fill="${d.color}" opacity=".42"/>`;
 else if(d.type==='mug')content=`<circle cx="${d.rx-4}" cy="0" r="11" fill="none" stroke="#53565a" stroke-width="8"/><ellipse rx="${d.rx-6}" ry="${d.ry}" fill="${d.color}" stroke="#53565a" stroke-width="2.5"/><ellipse rx="${d.rx-12}" ry="${d.ry-6}" fill="#fffaf5" stroke="#a2a2a2" stroke-width="2"/>`;
 else content=`<circle r="${d.rx}" fill="${d.color}" opacity=".83" stroke="#51575b" stroke-width="2.5"/><circle r="${d.rx*.76}" fill="#f8fcff" opacity=".75" stroke="#8d9cac" stroke-width="2"/><path d="M -8 -10 Q -15 0 -8 12" fill="none" stroke="white" stroke-width="4" opacity=".8"/>`;
 return `<g transform="translate(${x} ${y}) rotate(${a})" class="dish-svg ${extra}" data-dish="${id}">${content}</g>`;
}
function kitchenPoint(ev){const svg=$('#dishShelf');if(!svg)return null;const r=svg.getBoundingClientRect();return{x:(ev.clientX-r.left)*520/r.width,y:(ev.clientY-r.top)*300/r.height}}
function startKitchen(){kitchenPlaced=new Map();kitchenSelected=0;kitchenRotation=0;kitchenPointer=null;
 $('#gameHelp').textContent='';
 const stage=document.createElement('div');stage.className='realKitchen';stage.innerHTML=`<div class="realKitchenLayout"><div class="shelfWrap"><svg id="dishShelf" viewBox="0 0 520 300" aria-label="사용한 그릇을 쌓아 둘 싱크대"><defs><pattern id="rackLines" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 0 V18" stroke="#c8c8c2" stroke-width="3"/></pattern></defs><rect x="${KX-8}" y="${KY-8}" width="${KW+16}" height="${KH+16}" rx="23" fill="#a7adb2" stroke="#555" stroke-width="3"/><rect x="${KX}" y="${KY}" width="${KW}" height="${KH}" rx="15" fill="#f3f2ed" stroke="#666" stroke-width="2"/><rect x="${KX+5}" y="${KY+5}" width="${KW-10}" height="${KH-10}" rx="12" fill="url(#rackLines)"/><g id="dishLayer"></g></svg></div><div class="dishSidebar"><div id="dishTray" class="dishTray"></div></div></div><div class="kpControls"><button type="button" class="smallbtn" id="kpRotate" aria-label="그릇 회전" title="그릇 회전 (R / 스페이스)">↻</button><button type="button" class="smallbtn" id="kpUndo">↶ 마지막 그릇 꺼내기</button><button type="button" class="smallbtn" id="kpReset">다시 쌓기</button></div><div class="kpMsg" id="kpMsg" aria-live="polite"></div>`;
 area.appendChild(stage);$('#leftBtn').classList.add('hidden');$('#rightBtn').classList.add('hidden');
 $('#kpRotate').onclick=rotateKitchen;$('#kpUndo').onclick=()=>{const ids=[...kitchenPlaced.keys()];if(ids.length){const id=ids[ids.length-1];kitchenPlaced.delete(id);kitchenSelected=id;kitchenRotation=0;renderKitchen()}};
 $('#kpReset').onclick=()=>{kitchenPlaced.clear();kitchenSelected=0;kitchenRotation=0;renderKitchen()};
 const svg=$('#dishShelf');svg.addEventListener('pointerdown',e=>{const p=kitchenPoint(e),g=e.target.closest('[data-dish]');let id=kitchenSelected;
  if(g){id=Number(g.dataset.dish);const old=kitchenPlaced.get(id);kitchenPlaced.delete(id);kitchenSelected=id;kitchenRotation=old?.rot||0;renderKitchen()}
  if(id===null)return;kitchenPointer={id,start:p,moved:false};svg.setPointerCapture(e.pointerId);previewKitchen(p.x,p.y);
 });
 svg.addEventListener('pointermove',e=>{const p=kitchenPoint(e);if(!p)return;if(kitchenPointer){if(Math.hypot(p.x-kitchenPointer.start.x,p.y-kitchenPointer.start.y)>4)kitchenPointer.moved=true}previewKitchen(p.x,p.y)});
 svg.addEventListener('pointerup',e=>{if(!kitchenPointer)return;const p=kitchenPoint(e);kitchenPointer=null;placeKitchen(p.x,p.y)});
 svg.addEventListener('pointerleave',()=>{if(!kitchenPointer)renderKitchen()});renderKitchen();
}
function selectKitchen(id){if(kitchenPlaced.has(id))kitchenPlaced.delete(id);kitchenSelected=id;kitchenRotation=0;renderKitchen()}
function rotateKitchen(){if(!running||currentGame!=='kitchen'||kitchenSelected===null)return;kitchenRotation=(kitchenRotation+1)%4;renderKitchen()}
function placeKitchen(x,y){if(kitchenSelected===null)return;const id=kitchenSelected;if(!kitchenValid(id,x,y,kitchenRotation)){$('#kpMsg').textContent='그릇이 겹쳐요!';previewKitchen(x,y);return}
 kitchenPlaced.set(id,{x,y,rot:kitchenRotation});kitchenSelected=kitchenDefs.findIndex((_,i)=>!kitchenPlaced.has(i));if(kitchenSelected<0)kitchenSelected=null;kitchenRotation=0;renderKitchen();if(kitchenPlaced.size===kitchenDefs.length)end(true);
}
function previewKitchen(x,y){if(kitchenSelected===null)return;const layer=$('#dishLayer');if(!layer)return;renderDishLayer();const valid=kitchenValid(kitchenSelected,x,y,kitchenRotation);layer.insertAdjacentHTML('beforeend',`<g opacity="${valid?.7:.35}" style="pointer-events:none">${dishSVG(kitchenSelected,x,y,kitchenRotation)}</g>`)}
function renderDishLayer(){const layer=$('#dishLayer');if(layer)layer.innerHTML=[...kitchenPlaced].map(([id,p])=>dishSVG(id,p.x,p.y,p.rot)).join('')}
function renderKitchen(){const tray=$('#dishTray');if(!tray)return;renderDishLayer();tray.innerHTML='';kitchenDefs.forEach((d,id)=>{const btn=document.createElement('button');btn.type='button';btn.className='realDishButton'+(kitchenSelected===id?' selected':'')+(kitchenPlaced.has(id)?' placed':'');btn.innerHTML=`<svg viewBox="-60 -60 120 120" aria-hidden="true">${dishSVG(id,0,0,0)}</svg><span>${d.name}</span>`;btn.onclick=()=>selectKitchen(id);tray.appendChild(btn)});
 $('#kpMsg').textContent=kitchenSelected===null?'완료!':`${kitchenDefs[kitchenSelected].name} 선택 · 배치하기 (${kitchenPlaced.size}/${kitchenDefs.length})`;updateScore();
}
function startStack(){stackCount=0;stackPieces=[];stackDir=1;stackSpeed=125;stackMoving=true;
 $('#gameHelp').innerHTML='스페이스바: 옷 떨어뜨리기 · 10벌 쌓기';
 const stage=document.createElement('div');stage.className='stackStage';stage.innerHTML='<div class="ground"></div><div class="stackChair"><div class="backrest"></div><div class="seat"></div><div class="leg one"></div><div class="leg two"></div></div><div class="stackMessage" id="stackMessage">스페이스바로 떨어뜨리기</div><div class="stackTarget" id="stackTarget"></div>';
 area.appendChild(stage);const btn=$('#leftBtn');btn.textContent='옷 떨어뜨리기 (SPACE)';btn.classList.remove('hidden');btn.classList.add('stackDrop');
 $('#rightBtn').classList.add('hidden');
 const h=stage.clientHeight,w=stage.clientWidth;const chair=stage.querySelector('.stackChair');chair.style.left=w/2+'px';chair.style.bottom=(h*.18-5)+'px';
 makeNextGarment();
}
function makeNextGarment(){if(!running||currentGame!=='clothes')return;const stage=$('.stackStage'),w=stage.clientWidth,h=stage.clientHeight;
 stackWidth=Math.max(78,105-stackCount*1.3);stackX=(w-stackWidth)/2-90;stackDir=1;stackSpeed=215+stackCount*20;stackMoving=true;
 const colors=['#f6b6b0','#d9e5a5','#c7c2f5','#9fd8dc','#f7d794','#d8b7d8','#bed0ef','#d9e0b3','#f1c9af','#b7cdd4'];
 const el=document.createElement('div');el.className='stackGarment active';el.style.width=stackWidth+'px';el.style.background=colors[stackCount%colors.length];stage.appendChild(el);
 const top=Math.max(30,88-stackCount*5);el.style.top=top+'px';el.style.left=stackX+'px';el.dataset.top=top;
 const guide=$('#stackTarget');guide.style.width=stackWidth+'px';guide.style.left=(w-stackWidth)/2+'px';guide.style.top=(h*.82-43-stackCount*19-3)+'px';
 $('#stackMessage').textContent=`${stackCount+1} / 10`;
}
function dropGarment(){if(!running||currentGame!=='clothes'||!stackMoving)return;
 stackMoving=false;const stage=$('.stackStage'),el=stage.querySelector('.stackGarment.active');if(!el)return;
 const w=stage.clientWidth,h=stage.clientHeight;const center=stackX+stackWidth/2;
 const target=stackCount===0?w/2:stackPieces[stackPieces.length-1].center;
 const offset=Math.abs(center-target);
 const allowable=stackCount===0?48:Math.max(26,45-stackCount*1.4);
 const y=h*.82-43-stackCount*19-19;
 el.style.transition='top .32s ease-in';el.style.top=y+'px';
 if(offset>allowable){el.style.transform=`rotate(${center<target?-34:34}deg) translateY(58px)`;el.style.opacity='.5';$('#stackMessage').textContent='앗! 중심을 벗어나 옷더미가 무너졌어요!';stackTransition=setTimeout(()=>end(false),620);return;}
 stackPieces.push({center,width:stackWidth});stackCount++;el.classList.remove('active');
 el.style.transform=`rotate(${(center-target)*.07}deg)`;updateScore();
 if(stackCount>=10){$('#stackMessage').textContent='10벌 성공! 완벽한 옷 탑!';stackTransition=setTimeout(()=>end(true),550);return;}
 $('#stackMessage').textContent=`${stackCount} / 10`;
 stackTransition=setTimeout(()=>{stackTransition=null;makeNextGarment()},540);
}
function frame(t){if(!running)return;if(!lastTime)lastTime=t;const dt=Math.min((t-lastTime)/1000,.05);lastTime=t;elapsed+=dt;
 if(currentGame==='phone'){updatePhone(dt);if(!running)return;updateScore()}else if(stackMoving){const el=$('.stackGarment.active');if(el){const w=$('.stackStage').clientWidth;stackX+=stackDir*stackSpeed*dt;const minX=(w-stackWidth)/2-90,maxX=(w-stackWidth)/2+90;if(stackX<minX){stackX=minX;stackDir=1}if(stackX>maxX){stackX=maxX;stackDir=-1}el.style.left=stackX+'px'}}
 raf=requestAnimationFrame(frame);
}
function end(success){running=false;cancelAnimationFrame(raf);
 const messages={
  clothes:success?'엄마, 직접 해보니까 알겠지? 의자에 옷 안 무너지게 쌓는 것도 실력이라니까!':'엄마, 옷 쌓다가 무너졌지? 나도 아무렇게나 쌓아두는 게 아니라니까!',
  kitchen:success?'엄마, 직접 해보니 알겠지? 설거지 미룰 때도 그릇 쌓는 기술이 필요하다니까!':'엄마, 그릇 8개 넣는 것도 쉽지 않지? 내가 괜히 쌓아두는 게 아니라니까!',
  phone:success?'엄마, 직접 해보니까 알겠지? 누워서 핸드폰 안 떨어뜨리고 보는 것도 얼마나 어려운지!':'엄마, 핸드폰 떨어뜨렸지? 누워서 얼굴에 안 떨어뜨리고 보는 것도 실력이라니까!'
 };
 if(currentGame==='phone'){$('#resultTitle').textContent=success?'성공!':'떨어졌다!';}
 else if(currentGame==='kitchen'){$('#resultTitle').textContent=success?'성공!':'다시 도전!';}
 else{$('#resultTitle').textContent=success?'성공!':'와르르!';}
 $('#resultText').textContent=messages[currentGame]||'엄마, 이것도 다 실력이라니까!';
 result.classList.add('show');}

/* PHONE: fight unpredictable tilting with your pointer position. */
let phoneAngle=0,phoneVelocity=0,phonePointerX=0.5,phoneTime=0,phoneDrop=0,phoneJerk=0;
function startPhone(){gameDuration=15;phoneAngle=0;phoneVelocity=0;phonePointerX=.5;phoneTime=0;phoneDrop=0;phoneJerk=0;
 $('#gameHelp').textContent='← 마우스 →';
 const st=document.createElement('div');st.className='phoneStage phoneNewStage';
 st.innerHTML=`<div class="phoneStatus" id="phoneStatus">15.0초</div><div class="phoneDanger" id="phoneDanger">떨어진다!</div>
 <svg class="phoneArtwork" viewBox="0 0 850 470" preserveAspectRatio="xMidYMid meet" role="img" aria-label="얼굴 위에서 균형을 잡는 핸드폰. 단순한 흑백 그래픽">
  <!-- Only three objects: pillow, face, phone -->
  <rect x="276" y="248" width="298" height="150" rx="18" fill="#ebebeb" stroke="#111" stroke-width="5"/>
  <ellipse cx="425" cy="299" rx="101" ry="83" fill="white" stroke="#111" stroke-width="5"/>
  <path d="M348 265 Q357 257 372 265 M476 265 Q491 257 502 265" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <path d="M410 316 Q425 327 440 316" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <ellipse id="fallShadow" cx="425" cy="286" rx="40" ry="17" fill="#888" opacity=".17"/>
  <g id="phoneFalling" transform="translate(425 125)">
   <rect x="-48" y="-73" width="96" height="146" rx="13" fill="#111"/>
   <rect x="-41" y="-65" width="82" height="130" rx="8" fill="white"/>
   <rect x="-12" y="-58" width="24" height="4" rx="2" fill="#111"/>
   <circle cx="0" cy="51" r="5" fill="#aaa"/>
  </g>
 </svg>
 <div class="phoneMeter"><div class="phoneMarker" id="phoneMarker"></div></div>`;
 area.appendChild(st);
 const move=e=>{const r=st.getBoundingClientRect();phonePointerX=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))};
 st.addEventListener('pointermove',move);st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);move(e)});
}
function updatePhone(dt){
 phoneTime+=dt;
 const difficulty=1+Math.min(1.25,elapsed/17);
 if(Math.random()<dt*(2.8+difficulty*1.8))phoneJerk+=(Math.random()>.5?1:-1)*(16+Math.random()*21)*difficulty;
 phoneJerk*=Math.max(.5,1-dt*4.7);
 const drift=(Math.sin(phoneTime*3.6)*12+Math.sin(phoneTime*7.2)*7+Math.sin(phoneTime*1.35)*10)*difficulty;
 const userForce=(phonePointerX-.5)*205;
 phoneVelocity+=(drift+phoneJerk+userForce-phoneAngle*.31-phoneVelocity*1.2)*dt;
 phoneAngle+=phoneVelocity*dt;
 const danger=Math.min(1,Math.abs(phoneAngle)/43);
 phoneDrop=8+danger*92;
 $('#phoneFalling')?.setAttribute('transform',`translate(${425+phoneAngle*.28} ${125+phoneDrop}) rotate(${phoneAngle*1.05} 0 0)`);
 $('#fallShadow')?.setAttribute('opacity',String(.16+danger*.28));
 $('#phoneMarker').style.left=`${Math.max(0,Math.min(100,50+phoneAngle*.95))}%`;
 $('#phoneDanger').style.opacity=danger>.68?1:0;
 $('#phoneStatus').textContent=`${Math.max(0,15-elapsed).toFixed(1)}초`;
 if(Math.abs(phoneAngle)>43){end(false);return}
 if(elapsed>=15){end(true);return}
}
window.addEventListener('keydown',e=>{if(!running||e.code!=='Space')return;e.preventDefault();if(e.repeat)return;if(currentGame==='kitchen')rotateKitchen();else if(currentGame==='clothes')dropGarment()});
window.addEventListener('keydown',e=>{if(running&&currentGame==='kitchen'&&(e.key==='r'||e.key==='R')){e.preventDefault();rotateKitchen()}});
$('#leftBtn').addEventListener('click',()=>{if(currentGame==='clothes')dropGarment()});
area.addEventListener('pointerdown',e=>{if(currentGame==='clothes'&&running&&!e.target.closest('button'))dropGarment()});
</script></body></html>
